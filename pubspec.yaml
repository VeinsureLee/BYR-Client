name: byr_client
description: "Cross-platform BYR BBS client built with Flutter."
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  cryptography: ^2.7.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/em/
