name: Release Windows

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterVersion = (Get-Content -LiteralPath .flutter-version -Raw).Trim()
          $flutterPath = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $flutterVersion https://github.com/flutter/flutter.git $flutterPath
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK checkout failed' }
          (Join-Path $flutterPath 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build and package Windows release
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -creplace '^v', ''
          $buildArguments = @('run', 'tool/build_release.dart', '--platform', 'windows')
          if ($version -match '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            $buildArguments += @('--build-name', $version)
          }
          & dart @buildArguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseArguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag', '--title', $env:RELEASE_TAG, '--generate-notes'
          )
          if ($env:RELEASE_TAG -match '^v?[0-9]+\.[0-9]+\.[0-9]+-') {
            $releaseArguments += '--prerelease'
          }
          & gh @releaseArguments 'dist/windows/BYR-Client-windows-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
