name: Release Windows

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -trimpath -buildvcs=false
      MYGO_INSPECTOR: '0'
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Set application version from tag
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath mygo.json -Raw | ConvertFrom-Json
          $version = $env:RELEASE_TAG -creplace '^v', ''
          if ($version -match '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            $config.version = $version
            $configPath = Join-Path (Get-Location).Path 'mygo.json'
            [System.IO.File]::WriteAllText($configPath, ($config | ConvertTo-Json -Depth 20), [System.Text.UTF8Encoding]::new($false))
          }
          Write-Host "Building application version $($config.version) for tag $env:RELEASE_TAG"

      - name: Build Windows executables
        run: go tool mygo build -platform windows/amd64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath mygo.json -Raw | ConvertFrom-Json
          $assets = @(
            (Get-Item -LiteralPath 'dist/windows-amd64/BYR Client.exe').FullName
            (Get-Item -LiteralPath "dist/windows-amd64/BYR Client Setup $($config.version) amd64.exe").FullName
          )
          foreach ($asset in $assets) {
            if ((Get-Item -LiteralPath $asset).Length -eq 0) {
              throw "Empty release executable: $asset"
            }
          }
          $releaseArguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag', '--title', $env:RELEASE_TAG, '--generate-notes'
          )
          if ($config.version -match '^[0-9]+\.[0-9]+\.[0-9]+-') {
            $releaseArguments += '--prerelease'
          }
          & gh @releaseArguments @assets
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release failed with exit code $LASTEXITCODE"
          }
