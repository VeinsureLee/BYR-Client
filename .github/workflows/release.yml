name: Build desktop artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop target (feature migration build)
        type: choice
        required: true
        default: windows/amd64
        options:
          - windows/amd64
          - linux/amd64
          - darwin/arm64

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ fromJSON('{"windows/amd64":"windows-latest","linux/amd64":"ubuntu-latest","darwin/arm64":"macos-latest"}')[inputs.target] }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: apps/desktop/go.sum
      - run: go run ./tools/dev check --scope desktop
      - run: go run ./tools/dev build desktop --target "$DESKTOP_TARGET"
      - name: Identify output directory
        id: target
        run: |
          target_directory="${DESKTOP_TARGET/\//-}"
          echo "directory=$target_directory" >> "$GITHUB_OUTPUT"
      - name: Upload complete package and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ steps.target.outputs.directory }}
          path: |
            dist/desktop/${{ steps.target.outputs.directory }}/*.zip
            dist/desktop/${{ steps.target.outputs.directory }}/manifest.json
          if-no-files-found: error
          compression-level: 0
