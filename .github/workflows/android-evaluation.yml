name: Build Android Gio evaluation APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gio-evaluation:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: apps/android/probes/gio/go.sum
      - name: Prepare evaluation Android toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ANDROID_HOME) { throw 'Hosted Android SDK not found' }
          if (-not $env:JAVA_HOME_21_X64) { throw 'Hosted JDK 21 not found' }
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          "JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager '--install' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK component installation failed' }
          $ndkRoot = Join-Path $env:ANDROID_HOME 'ndk/28.2.13676358'
          "ANDROID_NDK_ROOT=$ndkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: go run ./tools/dev check --scope gio-probe
      - run: go run ./tools/dev build android-probe --framework gio
      - name: Verify APK signature
        run: |
          $signer = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
          & $signer verify 'dist/evaluation/android/gio/BYR-Gio-Probe.apk'
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation APK signature verification failed' }
      - name: Upload evaluation software, not a production release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-gio-evaluation
          path: dist/evaluation/android/gio/
          if-no-files-found: error
          compression-level: 0
